<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1320" width="1180" height="1320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">
<defs>
  <linearGradient id="heroG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1b3a5c"/>
    <stop offset="100%" stop-color="#2d5a87"/>
  </linearGradient>
  <linearGradient id="l2a" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fef7e6"/>
    <stop offset="100%" stop-color="#fdf0d5"/>
  </linearGradient>
  <linearGradient id="l2b" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#eef6fc"/>
    <stop offset="100%" stop-color="#e3eff9"/>
  </linearGradient>
  <linearGradient id="l3G" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#eaf5ee"/>
    <stop offset="100%" stop-color="#dcefe3"/>
  </linearGradient>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b2545" flood-opacity="0.13"/>
  </filter>
  <filter id="shHero" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b2545" flood-opacity="0.28"/>
  </filter>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7b8fa3"/>
  </marker>
  <style>
    .h1{font-size:34px;font-weight:800;fill:#fff;letter-spacing:.5px}
    .h1s{font-size:14.5px;fill:#a8c4dd;font-weight:500}
    .lvl{font-size:13px;font-weight:800;letter-spacing:2.5px}
    .lvlS{font-size:11.5px;fill:#8794a3;font-weight:500}
    .t{font-size:16px;font-weight:700;fill:#12324f}
    .s{font-size:12px;fill:#6b7c8f;font-family:"SF Mono",Consolas,Menlo,monospace}
    .b{font-size:12.5px;fill:#2d4a63}
    .bs{font-size:11.5px;fill:#5a7286}
    .badge{font-size:10.5px;font-weight:700;fill:#fff;letter-spacing:.4px}
    .lane{font-size:10.5px;font-weight:800;fill:#8ba3b8;letter-spacing:1.8px}
  </style>
</defs>

<rect width="1180" height="1320" fill="#f4f7fa"/>

<!-- ============ HERO: L0 ============ -->
<rect x="48" y="40" width="1084" height="152" rx="18" fill="url(#heroG)" filter="url(#shHero)"/>
<text x="80" y="88" class="h1">data-workflow</text>
<text x="80" y="114" class="h1s">技能只装流程 · 业务事实运行时从知识层读 · 代码是唯一权威</text>
<text x="80" y="140" class="h1s" font-size="13">paths.sh 解析路径 → repo_snapshot.sh 记 branch/commit → knowledge_drift.sh 标 FRESH/STALE（一次会话只跑一次）</text>
<rect x="80" y="152" width="150" height="26" rx="13" fill="#ffffff" opacity="0.14"/>
<text x="155" y="169" fill="#dce9f5" font-size="11.5" font-weight="700" text-anchor="middle">L0 · 薄编排器</text>
<rect x="242" y="152" width="196" height="26" rx="13" fill="#ffffff" opacity="0.14"/>
<text x="340" y="169" fill="#dce9f5" font-size="11.5" font-weight="700" text-anchor="middle">零业务事实 · 一次只读一个文件</text>

<!-- arrow L0 -> entry -->
<path d="M590,192 L590,232" stroke="#7b8fa3" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
<text x="604" y="218" font-size="11.5" fill="#7b8fa3" font-weight="600">选型：这句话属于哪条流程</text>

<!-- ============ ENTRY: two workflows, asymmetric ============ -->
<rect x="48" y="236" width="700" height="118" rx="14" fill="#fff" stroke="#2d5a87" stroke-width="2.4" filter="url(#sh)"/>
<rect x="48" y="236" width="700" height="34" rx="14" fill="#2d5a87"/>
<rect x="48" y="256" width="700" height="14" fill="#2d5a87"/>
<text x="72" y="259" font-size="13.5" font-weight="800" fill="#fff">feature / bugfix / hotfix · 九步链</text>
<text x="640" y="259" font-size="11.5" fill="#b6d0e4" font-weight="600">高风险变更</text>

<text x="72" y="296" class="b" font-weight="700" font-size="12.5">① 需求分析 → ② 影响面 → ③ 技术方案 → ④ 编码</text>
<text x="72" y="318" class="b" font-weight="700" font-size="12.5">→ ⑤ 审核 → ⑥ 质量 → ⑦ 接口 → ⑧ 提交</text>
<text x="72" y="340" class="bs">每步一个产物 · 停在缺产物或门没过的地方 · 契约/持久化/权限/状态/回滚一律走这里</text>

<rect x="768" y="236" width="364" height="118" rx="14" fill="#fff" stroke="#b98a2e" stroke-width="2.2" filter="url(#sh)"/>
<rect x="768" y="236" width="364" height="34" rx="14" fill="#b98a2e"/>
<rect x="768" y="256" width="364" height="14" fill="#b98a2e"/>
<text x="792" y="259" font-size="13.5" font-weight="800" fill="#fff">change · 三步</text>
<text x="1040" y="259" font-size="11.5" fill="#f0dcae" font-weight="600">单次改动</text>

<text x="792" y="296" class="b" font-weight="700" font-size="12.5">① decision.md</text>
<text x="792" y="318" class="b" font-weight="700" font-size="12.5">② 改文件</text>
<text x="792" y="340" class="b" font-weight="700" font-size="12.5">③ check.md</text>

<!-- ============ L1 BAND ============ -->
<text x="48" y="398" class="lane">L1 · 阶段文件</text>
<text x="196" y="398" class="lvlS">next 打印的 READ 点名才读，不进上下文</text>

<!-- row of stage pills, sized by weight -->
<g filter="url(#sh)">
  <rect x="48" y="412" width="152" height="72" rx="11" fill="#e8f2e9" stroke="#5c9c6b" stroke-width="1.7"/>
  <text x="124" y="438" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2f6b3e">需求分析</text>
  <text x="124" y="458" text-anchor="middle" font-size="10.5" fill="#5c8a68" font-family="monospace">spec.md</text>
  <text x="124" y="474" text-anchor="middle" font-size="10" fill="#7fa389">九项负债</text>
</g>
<g filter="url(#sh)">
  <rect x="212" y="412" width="152" height="72" rx="11" fill="#fdf2e4" stroke="#c9862f" stroke-width="1.7"/>
  <text x="288" y="438" text-anchor="middle" font-size="13.5" font-weight="800" fill="#96590f">影响面</text>
  <text x="288" y="458" text-anchor="middle" font-size="10.5" fill="#b07c3a" font-family="monospace">impact.md</text>
  <text x="288" y="474" text-anchor="middle" font-size="10" fill="#c09a68">四轴 + 三查</text>
</g>
<g filter="url(#sh)">
  <rect x="376" y="412" width="152" height="72" rx="11" fill="#e9eefb" stroke="#4a62b8" stroke-width="1.7"/>
  <text x="452" y="438" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2f3f8a">技术方案</text>
  <text x="452" y="458" text-anchor="middle" font-size="10.5" fill="#6273bd" font-family="monospace">plan/rollback</text>
  <text x="452" y="474" text-anchor="middle" font-size="10" fill="#8794c9">首行 plan pass</text>
</g>
<g filter="url(#sh)">
  <rect x="540" y="412" width="152" height="72" rx="11" fill="#f2eafb" stroke="#7c4fb0" stroke-width="1.7"/>
  <text x="616" y="438" text-anchor="middle" font-size="13.5" font-weight="800" fill="#5a2d8a">编码</text>
  <text x="616" y="458" text-anchor="middle" font-size="10.5" fill="#8a63bd" font-family="monospace">代码</text>
  <text x="616" y="474" text-anchor="middle" font-size="10" fill="#a986cc">复用门禁</text>
</g>
<g filter="url(#sh)">
  <rect x="704" y="412" width="152" height="72" rx="11" fill="#fdeaea" stroke="#b54a4a" stroke-width="1.7"/>
  <text x="780" y="438" text-anchor="middle" font-size="13.5" font-weight="800" fill="#8f2f2f">审核</text>
  <text x="780" y="458" text-anchor="middle" font-size="10.5" fill="#c06767" font-family="monospace">review/*.md</text>
  <text x="780" y="474" text-anchor="middle" font-size="10" fill="#cc8888">三轴并行</text>
</g>
<g filter="url(#sh)">
  <rect x="868" y="412" width="152" height="72" rx="11" fill="#e6f4f1" stroke="#3f8f83" stroke-width="1.7"/>
  <text x="944" y="438" text-anchor="middle" font-size="13.5" font-weight="800" fill="#256b60">质量</text>
  <text x="944" y="458" text-anchor="middle" font-size="10.5" fill="#4a9a8e" font-family="monospace">quality.md</text>
  <text x="944" y="474" text-anchor="middle" font-size="10" fill="#6aa89e">构建 + 单测</text>
</g>
<g filter="url(#sh)">
  <rect x="1032" y="412" width="100" height="72" rx="11" fill="#eef0f2" stroke="#7c8a96" stroke-width="1.7"/>
  <text x="1082" y="438" text-anchor="middle" font-size="12.5" font-weight="800" fill="#4a5866">接口</text>
  <text x="1082" y="458" text-anchor="middle" font-size="10" fill="#7c8a96" font-family="monospace">三级门</text>
  <text x="1082" y="474" text-anchor="middle" font-size="10" fill="#94a1ad">契约 diff</text>
</g>

<!-- side branches -->
<rect x="48" y="500" width="1084" height="42" rx="9" fill="#fbfcfd" stroke="#d3dde6" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="68" y="526" font-size="11.5" fill="#7b8fa3" font-weight="700">旁路（不插主链）</text>
<text x="212" y="526" class="bs">oncall 排查 · 只读，诊断不授权修改</text>
<text x="500" y="526" class="bs">excalidraw 画图 · spec JSON → svg/png</text>
<text x="800" y="526" class="bs">review-only · 只审不改</text>

<!-- ============ GATES — the centerpiece, big ============ -->
<path d="M590,556 L590,592" stroke="#7b8fa3" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
<text x="604" y="580" font-size="11.5" fill="#7b8fa3" font-weight="600">判据全部机器可读，不靠中文形容词</text>

<rect x="48" y="596" width="1084" height="252" rx="16" fill="#fff" stroke="#c2453f" stroke-width="2.6" filter="url(#sh)"/>
<rect x="48" y="596" width="1084" height="46" rx="16" fill="#c2453f"/>
<rect x="48" y="626" width="1084" height="16" fill="#c2453f"/>
<text x="76" y="619" font-size="15" font-weight="800" fill="#fff">四类门 · 任一门未过就停下，不自行绕过</text>
<text x="76" y="636" font-size="10.5" fill="#f8d9d6" font-weight="600">默认 fail-open（hook 崩了、找不到 python、坏输入 → 放行并说明）；写 gate_strict: "true" 才转严格</text>

<!-- 4 gate cards inside -->
<g>
  <rect x="76" y="658" width="248" height="140" rx="10" fill="#fef5f4" stroke="#dfa5a1" stroke-width="1.5"/>
  <text x="94" y="682" font-size="13" font-weight="800" fill="#a8382f">① 写入门禁</text>
  <text x="94" y="700" font-size="10.5" fill="#b3706a" font-family="monospace">hooks/gate-edit</text>
  <text x="94" y="722" class="bs">改受保护路径前，必须有</text>
  <text x="94" y="740" class="bs">一条 approve 签发的放行行</text>
  <text x="94" y="762" font-size="10.5" fill="#8f5a55">没签 → 拒绝写入 + 给下一步</text>
  <text x="94" y="780" font-size="10.5" fill="#8f5a55">passes.log 手写不作数</text>
</g>
<g>
  <rect x="340" y="658" width="248" height="140" rx="10" fill="#fffaf0" stroke="#e0c07a" stroke-width="1.5"/>
  <text x="358" y="682" font-size="13" font-weight="800" fill="#9a6d10">② 内容门</text>
  <text x="358" y="700" font-size="10.5" fill="#b89448" font-family="monospace">requires</text>
  <text x="358" y="722" class="bs">产物里有没有那几行字面量</text>
  <text x="358" y="740" class="bs">如「未知」「可能理解错的地方」</text>
  <text x="358" y="762" font-size="10.5" fill="#8f7434">只看写没写，不判好坏</text>
  <text x="358" y="780" font-size="10.5" fill="#8f7434">缺任一行 → GATE 并停</text>
</g>
<g>
  <rect x="604" y="658" width="248" height="140" rx="10" fill="#f2f8fd" stroke="#9dc2e0" stroke-width="1.5"/>
  <text x="622" y="682" font-size="13" font-weight="800" fill="#1e5f8f">③ 命令门</text>
  <text x="622" y="700" font-size="10.5" fill="#5f8fb5" font-family="monospace">gate_check</text>
  <text x="622" y="722" class="bs">一条 shell 命令的退出码</text>
  <text x="622" y="740" class="bs">change 阶段查工作树真动过</text>
  <text x="622" y="762" font-size="10.5" fill="#4d7a9c">一个文件没变就 done → 拦</text>
  <text x="622" y="780" font-size="10.5" fill="#4d7a9c">纯 .gitignore 改动是已知盲区</text>
</g>
<g>
  <rect x="868" y="658" width="236" height="140" rx="10" fill="#f0f9f4" stroke="#8fc7a6" stroke-width="1.5"/>
  <text x="886" y="682" font-size="13" font-weight="800" fill="#1d6b41">④ 完成门</text>
  <text x="886" y="700" font-size="10.5" fill="#5b9a76" font-family="monospace">run_verify</text>
  <text x="886" y="722" class="bs">跑仓库自己的测试入口</text>
  <text x="886" y="740" class="bs">退出码非 0 → 停在 RED</text>
  <text x="886" y="762" font-size="10.5" fill="#457a5e">输出进 verify.log</text>
  <text x="886" y="780" font-size="10.5" fill="#457a5e">首行是 exit 那一行</text>
</g>

<!-- evidence strip -->
<rect x="76" y="810" width="1028" height="26" rx="6" fill="#fdf0ef"/>
<text x="92" y="828" font-size="10.5" font-weight="700" fill="#a8382f">证据链落在 specs/&lt;feature&gt;/ ：run.json 进度 · evidence.log 每推进一行 · verify.log 原始输出 · passes.log 放行行 · gate 首行 plan pass</text>

<!-- ============ L2 ============ -->
<text x="48" y="886" class="lane">L2 · 知识层</text>
<text x="196" y="886" class="lvlS">一次只加载一个域文件</text>

<rect x="48" y="900" width="534" height="150" rx="13" fill="url(#l2a)" stroke="#d9b469" stroke-width="1.9" filter="url(#sh)"/>
<text x="72" y="928" font-size="14" font-weight="800" fill="#8a6414">业务事实 · $KNOW / $CARDS</text>
<text x="72" y="948" font-size="10.5" fill="#a98a4c" font-family="monospace">路径来自 config.yaml，不猜</text>
<text x="72" y="974" class="b">九个维度：对象身份 · 状态族 · 迁移守卫 · 可见性</text>
<text x="72" y="994" class="b">角色范围 · 外部通道 · 幂等重试 · 审计通知 · 契约</text>
<text x="72" y="1018" font-size="11" fill="#8a6414">落点优先级：仓库 docs/domain → $KNOW → 仓库 docs（降级区）→ 个人卡片</text>
<text x="72" y="1036" font-size="11" fill="#8a6414">卡片带 verified_commit + watches，knowledge_drift.sh 判 FRESH/STALE</text>

<rect x="598" y="900" width="534" height="150" rx="13" fill="url(#l2b)" stroke="#7fa9cb" stroke-width="1.9" filter="url(#sh)"/>
<text x="622" y="928" font-size="14" font-weight="800" fill="#1b527d">工程事实 · 仓库成文规范</text>
<text x="622" y="948" font-size="10.5" fill="#6b93b3" font-family="monospace">落点按 project-index 解析，不假设 IDE 目录</text>
<text x="622" y="974" class="b">分层目录 · 生成命令 · 构建入口 · 复用门禁 R01–R18</text>
<text x="622" y="994" class="b">技术栈取值集中在 profiles/go-kratos/profile.md</text>
<text x="622" y="1018" font-size="11" fill="#1b527d">通用阶段正文只放守卫句，不内嵌具体路径与命令</text>
<text x="622" y="1036" font-size="11" fill="#1b527d">多 agent 不会自动加载别家 IDE 的目录，需显式 Read</text>

<!-- ============ L3 ============ -->
<path d="M590,1054 L590,1086" stroke="#7b8fa3" stroke-width="2.2" fill="none" marker-end="url(#ar)"/>
<text x="604" y="1076" font-size="11.5" fill="#7b8fa3" font-weight="600">取值一律回代码核对</text>

<rect x="48" y="1090" width="1084" height="112" rx="14" fill="url(#l3G)" stroke="#4d8a62" stroke-width="2.2" filter="url(#sh)"/>
<text x="76" y="1120" font-size="16" font-weight="800" fill="#1d5936">L3 · 权威：代码 / 生成物 / 聚焦测试</text>
<text x="76" y="1144" font-size="12" fill="#2f6b45" font-weight="600">技能与知识层只放指针，永不上抄事实</text>

<rect x="76" y="1158" width="1028" height="30" rx="7" fill="#ffffff" opacity="0.62"/>
<text x="94" y="1178" font-size="11.5" fill="#1d5936" font-weight="700">易变性测试：</text>
<text x="188" y="1178" font-size="11.5" fill="#2f6b45">明天一次提交就能让这句话变假 → 是事实，进知识层；不会 → 是流程，进技能。指针是流程，取值是事实。</text>

<!-- footer -->
<text x="48" y="1242" font-size="11" fill="#93a2b1">v0.3 · 与 workflows/*.json、references/edit-gate.md、references/commands.md 同步</text>
<text x="48" y="1262" font-size="11" fill="#93a2b1">改这张图：直接编辑 assets/architecture.svg，或改 .staging/architecture.spec.json 后跑 docs/diagrams.md 里的命令</text>
<text x="48" y="1282" font-size="11" fill="#93a2b1">图中所有文件名、脚本名、退出码语义均可在仓库中 grep 验证</text>
</svg>
