<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1190" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <filter id="red-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#e03131" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1.5 L 7.5 4.5 L 0 7.5 Z" fill="#495057" />
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1.5 L 7.5 4.5 L 0 7.5 Z" fill="#e03131" />
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; fill: #1e1e1e; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 500; fill: #495057; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; font-size: 19px; }
      .card-sub { font-family: "SF Mono", "Consolas", Menlo, monospace; font-size: 13px; fill: #868e96; }
      .card-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 14.5px; fill: #2b2b2b; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: 600; fill: #495057; text-anchor: middle; }
      .cfg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: 700; fill: #c92a2a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>

  <g transform="translate(560, 50)" text-anchor="middle">
    <text class="title" font-size="30" y="0">data-workflow · 分层架构</text>
    <text class="subtitle" font-size="16" y="32">技能只装流程，业务事实运行时从知识库按需加载</text>
  </g>

  <!-- 卡片 -->
  
    <g transform="translate(30, 108)" filter="url(#shadow)">
      <rect width="1060" height="156" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2"/>
      <text class="card-title" x="530" y="36" text-anchor="middle" fill="#212529">L0 编排器 · data-workflow:data-workflow</text>
      <text class="card-sub" x="530" y="56" text-anchor="middle">skills/data-workflow/SKILL.md · 83 行 · 零业务事实</text>
      <line x1="25" y1="72" x2="1035" y2="72" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 启动：环境探测 repo_snapshot.sh + knowledge_drift.sh（一次会话只跑一次，结果向下传递）</text>
        <text y="28">• 选型表 · 串联顺序 · 三道门禁 · 查重防冲突 · 只用命名空间名引用其他技能</text>
      </g>
    </g>

    <g transform="translate(30, 300)" filter="url(#shadow)">
      <rect width="340" height="156" rx="14" fill="#ebfbee" stroke="#0ca678" stroke-width="2"/>
      <text class="card-title" x="170" y="36" text-anchor="middle" fill="#0ca678">需求分析</text>
      <text class="card-sub" x="170" y="56" text-anchor="middle">requirement-analysis · 84 行</text>
      <line x1="25" y1="72" x2="315" y2="72" stroke="#b2f2bb" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 拆需求、定验收口径</text>
        <text y="28">• 调用 grilling 压测假设</text>
      </g>
    </g>

    <g transform="translate(390, 300)" filter="url(#shadow)">
      <rect width="340" height="156" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
      <text class="card-title" x="170" y="36" text-anchor="middle" fill="#1971c2">技术方案</text>
      <text class="card-sub" x="170" y="56" text-anchor="middle">tech-design · 29 行</text>
      <line x1="25" y1="72" x2="315" y2="72" stroke="#a5d8ff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 读 Obsidian 方案模板</text>
        <text y="28">• 只写流程不抄业务</text>
      </g>
    </g>

    <g transform="translate(750, 300)" filter="url(#shadow)">
      <rect width="340" height="156" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
      <text class="card-title" x="170" y="36" text-anchor="middle" fill="#7048e8">实现</text>
      <text class="card-sub" x="170" y="56" text-anchor="middle">implementation · 69 行 + 2 refs</text>
      <line x1="25" y1="72" x2="315" y2="72" stroke="#d0bfff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• go-style.md R01–R18</text>
        <text y="28">• reuse-gate.md 复用门禁</text>
      </g>
    </g>

    <g transform="translate(30, 472)" filter="url(#shadow)">
      <rect width="340" height="156" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
      <text class="card-title" x="170" y="36" text-anchor="middle" fill="#e8590c">改动审核</text>
      <text class="card-sub" x="170" y="56" text-anchor="middle">change-review · 130 行 + 1 ref</text>
      <line x1="25" y1="72" x2="315" y2="72" stroke="#ffc078" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• high/medium 风险即停</text>
        <text y="28">• 点名 API 必须 grep 验证</text>
      </g>
    </g>

    <g transform="translate(390, 472)" filter="url(#shadow)">
      <rect width="340" height="156" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
      <text class="card-title" x="170" y="36" text-anchor="middle" fill="#c92a2a">质量门</text>
      <text class="card-sub" x="170" y="56" text-anchor="middle">quality-gate · 85 行</text>
      <line x1="25" y1="72" x2="315" y2="72" stroke="#ffc9c9" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• make api-one PROTO=…</text>
        <text y="28">• 聚焦测试 + 覆盖率</text>
      </g>
    </g>

    <g transform="translate(750, 472)" filter="url(#shadow)">
      <rect width="340" height="156" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2"/>
      <text class="card-title" x="170" y="36" text-anchor="middle" fill="#212529">提交 / MR</text>
      <text class="card-sub" x="170" y="56" text-anchor="middle">git-commit · 145 行</text>
      <line x1="25" y1="72" x2="315" y2="72" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• Conventional Commits</text>
        <text y="28">• MR 模板走 Obsidian 指针</text>
      </g>
    </g>

    <g transform="translate(30, 644)" filter="url(#shadow)">
      <rect width="340" height="156" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
      <text class="card-title" x="170" y="36" text-anchor="middle" fill="#1971c2">线上排查</text>
      <text class="card-sub" x="170" y="56" text-anchor="middle">oncall · 57 行 + 7 refs</text>
      <line x1="25" y1="72" x2="315" y2="72" stroke="#a5d8ff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 状态族隔离 5 条</text>
        <text y="28">• 证据阶梯 6 层 + 降级区</text>
      </g>
    </g>

    <g transform="translate(390, 644)" filter="url(#shadow)">
      <rect width="340" height="156" rx="14" fill="#ebfbee" stroke="#0ca678" stroke-width="2"/>
      <text class="card-title" x="170" y="36" text-anchor="middle" fill="#0ca678">画图</text>
      <text class="card-sub" x="170" y="56" text-anchor="middle">excalidraw-diagram · 135 行</text>
      <line x1="25" y1="72" x2="315" y2="72" stroke="#b2f2bb" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• spec JSON → svg/excalidraw</text>
        <text y="28">• README 两张图即产出</text>
      </g>
    </g>

    <g transform="translate(750, 644)" filter="url(#shadow)">
      <rect width="340" height="156" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
      <text class="card-title" x="170" y="36" text-anchor="middle" fill="#c92a2a">渐进披露</text>
      <text class="card-sub" x="170" y="56" text-anchor="middle">3 级加载 · 硬性约束</text>
      <line x1="25" y1="72" x2="315" y2="72" stroke="#ffc9c9" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• SKILL.md 触发时才读</text>
        <text y="28">• references 点名才读</text>
      </g>
    </g>

    <g transform="translate(30, 836)" filter="url(#shadow)">
      <rect width="520" height="156" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
      <text class="card-title" x="260" y="36" text-anchor="middle" fill="#e8590c">L2 业务事实 F2</text>
      <text class="card-sub" x="260" y="56" text-anchor="middle">Obsidian xxz_obsidian/knowledge/</text>
      <line x1="25" y1="72" x2="495" y2="72" stroke="#ffc078" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 按业务域拆分，一次只读一个文件</text>
        <text y="28">• 排查卡片/ 带 verified_commit + watches</text>
      </g>
    </g>

    <g transform="translate(570, 836)" filter="url(#shadow)">
      <rect width="520" height="156" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
      <text class="card-title" x="260" y="36" text-anchor="middle" fill="#7048e8">L2 工程事实 F1</text>
      <text class="card-sub" x="260" y="56" text-anchor="middle">.cursor/rules/*.mdc</text>
      <line x1="25" y1="72" x2="495" y2="72" stroke="#d0bfff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 分层 / 生成物 / 构建命令唯一副本</text>
        <text y="28">• Qoder 不自动加载，需显式 Read</text>
      </g>
    </g>

    <g transform="translate(30, 1028)" filter="url(#shadow)">
      <rect width="1060" height="128" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2"/>
      <text class="card-title" x="530" y="36" text-anchor="middle" fill="#212529">L3 权威 · 代码 / 生成物 / 聚焦测试</text>
      <text class="card-sub" x="530" y="56" text-anchor="middle">永不上抄 —— 技能与知识层只放指针</text>
      <line x1="25" y1="72" x2="1035" y2="72" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 任何结论都必须能在当前 checkout 里指认；一次提交就能证伪的取值一律不进技能</text>
      </g>
    </g>

  <!-- 连线与标签 -->
  
    <g>
      <path d="M 560 264 L 560 300" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="590" y="268" width="110" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="645" y="282" text-anchor="middle">选型表路由</text>
    </g>

    <g>
      <path d="M 560 800 L 560 836" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="585" y="804" width="210" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="690" y="818" text-anchor="middle">点名才读 · 一次一个域文件</text>
    </g>

    <g>
      <path d="M 560 992 L 560 1028" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="584.5" y="996" width="175" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="672" y="1010" text-anchor="middle">取值一律回代码核对</text>
    </g>

  <!-- 配置驱动底框 -->
  
</svg>