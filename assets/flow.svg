<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1320" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
    <filter id="red-shadow" x="-4%" y="-4%" width="108%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#e03131" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1.5 L 7.5 4.5 L 0 7.5 Z" fill="#495057" />
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 1.5 L 7.5 4.5 L 0 7.5 Z" fill="#e03131" />
    </marker>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; fill: #1e1e1e; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 500; fill: #495057; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: 700; font-size: 19px; }
      .card-sub { font-family: "SF Mono", "Consolas", Menlo, monospace; font-size: 13px; fill: #868e96; }
      .card-item { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 14.5px; fill: #2b2b2b; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: 600; fill: #495057; text-anchor: middle; }
      .cfg-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 13px; font-weight: 700; fill: #c92a2a; text-anchor: middle; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="16"/>

  <g transform="translate(560, 50)" text-anchor="middle">
    <text class="title" font-size="30" y="0">data-workflow · 一次需求到提交 v0.2</text>
    <text class="subtitle" font-size="16" y="32">workflows/feature.json 主链九步 · S 型串行 · 六道门贯穿 · 旁路不插队</text>
  </g>

  <!-- 卡片 -->
  
    <g transform="translate(30, 100)" filter="url(#shadow)">
      <rect width="1060" height="160" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2"/>
      <text class="card-title" x="530" y="36" text-anchor="middle" fill="#212529">① 启动 · data-workflow:data-workflow</text>
      <text class="card-sub" x="530" y="56" text-anchor="middle">一次会话只跑一次，结果向下传递；所有步骤技能不再重复探测</text>
      <line x1="25" y1="72" x2="1035" y2="72" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• paths.sh 解析 $KNOW/$CARDS/$TEMPLATES/$REPO → repo_snapshot.sh 记 branch/commit/dirty → knowledge_drift.sh 标 FRESH/STALE</text>
        <text y="28">• grep specs/ 与 $CARDS/ 查重（命中就接着做，不重开）→ 选型表定要做的事 → workflows/*.json 定按哪条流程串</text>
      </g>
    </g>

    <g transform="translate(30, 296)" filter="url(#shadow)">
      <rect width="330" height="190" rx="14" fill="#ebfbee" stroke="#0ca678" stroke-width="2"/>
      <text class="card-title" x="165" y="36" text-anchor="middle" fill="#0ca678">② 需求分析</text>
      <text class="card-sub" x="165" y="56" text-anchor="middle">requirement-analysis → spec.md</text>
      <line x1="25" y1="72" x2="305" y2="72" stroke="#b2f2bb" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 九项负债评估先于选方案</text>
        <text y="28">• 方案 ≥2 且必含最小改动</text>
        <text y="56">• 拍板走 grilling</text>
      </g>
    </g>

    <g transform="translate(395, 296)" filter="url(#shadow)">
      <rect width="330" height="190" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
      <text class="card-title" x="165" y="36" text-anchor="middle" fill="#e8590c">③ 影响面评估</text>
      <text class="card-sub" x="165" y="56" text-anchor="middle">impact-assessment → impact.md</text>
      <line x1="25" y1="72" x2="305" y2="72" stroke="#ffc078" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 四轴 + 维护性三查</text>
        <text y="28">• 每项带证据或 UNVERIFIED</text>
        <text y="56">• 四轴可并行取证</text>
      </g>
    </g>

    <g transform="translate(760, 296)" filter="url(#shadow)">
      <rect width="330" height="190" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
      <text class="card-title" x="165" y="36" text-anchor="middle" fill="#1971c2">④ 技术方案 + 回滚预案</text>
      <text class="card-sub" x="165" y="56" text-anchor="middle">tech-design → plan.md · rollback.md</text>
      <line x1="25" y1="72" x2="305" y2="72" stroke="#a5d8ff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 套公司模板，空章节写「无」</text>
        <text y="28">• 回滚必须是编号步骤</text>
        <text y="56">• 单一作者视角，不拆子 agent</text>
      </g>
    </g>

    <g transform="translate(760, 538)" filter="url(#shadow)">
      <rect width="330" height="190" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
      <text class="card-title" x="165" y="36" text-anchor="middle" fill="#7048e8">⑤ 实现</text>
      <text class="card-sub" x="165" y="56" text-anchor="middle">implementation</text>
      <line x1="25" y1="72" x2="305" y2="72" stroke="#d0bfff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 先搜再写，重复三次才抽象</text>
        <text y="28">• 碰到端点补契约测试</text>
        <text y="56">• 实现类子 agent 禁止并行</text>
      </g>
    </g>

    <g transform="translate(395, 538)" filter="url(#shadow)">
      <rect width="330" height="190" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/>
      <text class="card-title" x="165" y="36" text-anchor="middle" fill="#e8590c">⑥ 改动审核（三轴并行）</text>
      <text class="card-sub" x="165" y="56" text-anchor="middle">change-review → diff.patch + review/*.md</text>
      <line x1="25" y1="72" x2="305" y2="72" stroke="#ffc078" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• spec 合规 / 代码质量 / 接口影响</text>
        <text y="28">• 三轴共读同一份 diff</text>
        <text y="56">• 主 agent 合并裁决 risk 等级</text>
      </g>
    </g>

    <g transform="translate(30, 538)" filter="url(#shadow)">
      <rect width="330" height="190" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
      <text class="card-title" x="165" y="36" text-anchor="middle" fill="#c92a2a">⑦ 质量门</text>
      <text class="card-sub" x="165" y="56" text-anchor="middle">quality-gate → quality.md</text>
      <line x1="25" y1="72" x2="305" y2="72" stroke="#ffc9c9" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 构建 + 聚焦单测 + 覆盖率</text>
        <text y="28">• 只跑受影响包，不顺手全量</text>
        <text y="56">• 没跑过的检查不许标 ✓</text>
      </g>
    </g>

    <g transform="translate(30, 780)" filter="url(#shadow)">
      <rect width="330" height="190" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
      <text class="card-title" x="165" y="36" text-anchor="middle" fill="#c92a2a">⑧ 接口门（三级）</text>
      <text class="card-sub" x="165" y="56" text-anchor="middle">interface-test → interface-test.md</text>
      <line x1="25" y1="72" x2="305" y2="72" stroke="#ffc9c9" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• go test ./api/... 硬门</text>
        <text y="28">• contract_diff.sh 判 breaking</text>
        <text y="56">• 回放跑不了如实 WAIVED</text>
      </g>
    </g>

    <g transform="translate(395, 780)" filter="url(#shadow)">
      <rect width="330" height="190" rx="14" fill="#f1f3f5" stroke="#343a40" stroke-width="2"/>
      <text class="card-title" x="165" y="36" text-anchor="middle" fill="#212529">⑨ 文档审计 + 提交 / MR</text>
      <text class="card-sub" x="165" y="56" text-anchor="middle">git-commit → change-note.md · commit</text>
      <line x1="25" y1="72" x2="305" y2="72" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 逐项核 specs/README/CONTEXT/生成物</text>
        <text y="28">• 不同步 → 补齐 或 显式记账</text>
        <text y="56">• MR 套 $MR_TEMPLATE</text>
      </g>
    </g>

    <g transform="translate(760, 780)" filter="url(#shadow)">
      <rect width="330" height="190" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
      <text class="card-title" x="165" y="36" text-anchor="middle" fill="#7048e8">多 agent 怎么用</text>
      <text class="card-sub" x="165" y="56" text-anchor="middle">references/subagent-protocol.md</text>
      <line x1="25" y1="72" x2="305" y2="72" stroke="#d0bfff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(24, 102)">
        <text y="0">• 派：≥2 个独立、无共享写状态</text>
        <text y="28">• 不派：实现、探索性 debug、裁决</text>
        <text y="56">• fix loop ≤2 轮 → parked with ruling</text>
      </g>
    </g>

  <!-- 连线与标签 -->
  
    <g>
      <path d="M 560 260 L 560 296" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="577.5" y="264" width="165" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="660" y="278" text-anchor="middle">选完工作流进主链</text>
    </g>

    <g>
      <path d="M 360 391 L 395 391" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
    </g>

    <g>
      <path d="M 725 391 L 760 391" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
    </g>

    <g>
      <path d="M 925 486 L 925 538" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="955" y="498" width="90" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="1000" y="512" text-anchor="middle">方案定稿</text>
    </g>

    <g>
      <path d="M 760 633 L 725 633" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
    </g>

    <g>
      <path d="M 395 633 L 360 633" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
    </g>

    <g>
      <path d="M 195 728 L 195 780" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
      <rect x="157.5" y="740" width="105" height="22" rx="4" fill="#f1f3f5" />
      <text class="tag-text" x="210" y="754" text-anchor="middle">审核可继续</text>
    </g>

    <g>
      <path d="M 360 875 L 395 875" fill="none" stroke="#495057" stroke-width="2.2"  marker-end="url(#arrow-gray)"/>
      
    </g>

  <!-- 配置驱动底框 -->
  
    <g transform="translate(30, 1010)" filter="url(#red-shadow)">
      <rect width="520" height="270" rx="16" fill="#fff5f5" stroke="#e03131" stroke-width="2.5"/>
      <text class="card-title" x="260" y="36" text-anchor="middle" fill="#c92a2a" font-size="22">贯穿全程 · 六道门</text>
      <text class="card-sub" x="260" y="58" text-anchor="middle" font-size="14">任一未过就停下等用户，不自行绕过</text>
      <line x1="30" y1="74" x2="490" y2="74" stroke="#ffc9c9" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(35, 104)" font-size="15">
        <text y="0">• <tspan font-weight="700">① 负债门</tspan> 九项评估有阻塞且无缓解 = 不进技术方案</text>
        <text y="28">• <tspan font-weight="700">② 影响面门</tspan> 整轴 UNVERIFIED 就下结论 = 评估未做</text>
        <text y="56">• <tspan font-weight="700">③ 审核门</tspan> high/medium 即停；指纹不符 = STALE 重跑</text>
        <text y="84">• <tspan font-weight="700">④ 接口门</tspan> breaking 未逐行裁决 = FAIL；跑不了 WAIVED</text>
        <text y="112">• <tspan font-weight="700">⑤ 文档审计门</tspan> 不同步又不记账 = 不许沉默提交</text>
        <text y="140">• <tspan font-weight="700">⑥ 新鲜度</tspan> 引用 STALE 取值却没回代码推导 = 未过</text>
      </g>
    </g>

    <g transform="translate(570, 1010)" filter="url(#red-shadow)">
      <rect width="520" height="270" rx="16" fill="#e7f5ff" stroke="#1971c2" stroke-width="2.5"/>
      <text class="card-title" x="260" y="36" text-anchor="middle" fill="#1971c2" font-size="22">旁路与裁剪 · 不插进主链</text>
      <text class="card-sub" x="260" y="58" text-anchor="middle" font-size="14">工作流是主链的裁剪版，缺的阶段要在 change-note 记账</text>
      <line x1="30" y1="74" x2="490" y2="74" stroke="#a5d8ff" stroke-width="1.5" stroke-dasharray="4,4"/>
      <g class="card-item" transform="translate(35, 104)" font-size="15">
        <text y="0">• oncall：仓库只读，诊断不授权修改</text>
        <text y="28">• excalidraw-diagram：spec JSON → 图（本图即产出）</text>
        <text y="56">• bugfix 先复现失败测试；hotfix 先回滚预案</text>
        <text y="84">• review-only：只审不改，产物三轴报告 + 接口裁决</text>
      </g>
    </g>
</svg>