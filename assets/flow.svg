<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1420" width="1180" height="1420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif">
<defs>
  <linearGradient id="hd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#14324f"/><stop offset="100%" stop-color="#2b5a80"/>
  </linearGradient>
  <linearGradient id="rl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f6c9c4"/><stop offset="100%" stop-color="#f2d0cc"/>
  </linearGradient>
  <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#b8e0c4"/><stop offset="100%" stop-color="#cbe9d4"/>
  </linearGradient>
  <filter id="d1" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0b2545" flood-opacity="0.12"/>
  </filter>
  <filter id="d2" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="11" flood-color="#0b2545" flood-opacity="0.3"/>
  </filter>
  <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8296aa"/>
  </marker>
  <marker id="nr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c2453f"/>
  </marker>
  <marker id="ng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#3f8f60"/>
  </marker>
  <style>
    .hd1{font-size:30px;font-weight:800;fill:#fff}
    .hd2{font-size:14px;fill:#a9c5dc}
    .st{font-size:15px;font-weight:800}
    .cm{font-size:11px;fill:#7d8fa1;font-family:"SF Mono",Consolas,Menlo,monospace}
    .it{font-size:12px;fill:#2f4d67}
    .gt{font-size:11.5px;fill:#5b7286}
    .lab{font-size:10.5px;font-weight:800;letter-spacing:1.6px;fill:#8ea3b6}
    .cmd{font-size:11.5px;font-family:"SF Mono",Consolas,Menlo,monospace;fill:#1b4d73;font-weight:600}
    .out{font-size:11.5px;font-family:"SF Mono",Consolas,Menlo,monospace;fill:#a8382f;font-weight:700}
    .note{font-size:11px;fill:#8296aa}
  </style>
</defs>

<rect width="1180" height="1420" fill="#f4f7fa"/>

<!-- HERO -->
<rect x="48" y="36" width="1084" height="118" rx="16" fill="url(#hd)" filter="url(#d2)"/>
<text x="80" y="80" class="hd1">一次改动 · 从原话到提交</text>
<text x="80" y="106" class="hd2">每一步只做一件事 · 每次都先 next 看你卡在哪 · 门没过就停，不自行绕过</text>
<text x="80" y="130" class="hd2" font-size="12.5">下面这条是 feature / hotfix 的九步；任意仓库的一次小改走 change 三步（图末）</text>

<!-- ===== STEP 1 ===== -->
<path d="M590,154 L590,186" stroke="#8296aa" stroke-width="2.2" marker-end="url(#n)"/>

<rect x="48" y="190" width="1084" height="96" rx="12" fill="#fff" stroke="#2d5a87" stroke-width="2.2" filter="url(#d1)"/>
<circle cx="82" cy="216" r="15" fill="#2d5a87"/>
<text x="82" y="221" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text>
<text x="110" y="221" class="st" fill="#1b4d73">起一条运行</text>
<text x="110" y="242" class="cm">start change &lt;feature&gt; "&lt;用户原话&gt;"</text>
<rect x="470" y="196" width="286" height="24" rx="5" fill="#eef4f9"/>
<text x="482" y="213" class="note" font-weight="700">原话一字不改写进 run.json</text>
<text x="110" y="266" class="it">记下 branch / commit / dirty；知识层新鲜度标 FRESH 或 STALE（一次会话只跑一次）</text>

<path d="M590,290 L590,318" stroke="#8296aa" stroke-width="2.2" marker-end="url(#n)"/>
<text x="604" y="309" class="note" font-weight="700">next → 打 RAW，把原话原样吐回来</text>

<!-- ===== STEP 2 ===== -->
<rect x="48" y="322" width="1084" height="188" rx="12" fill="#fff" stroke="#5c9c6b" stroke-width="2.2" filter="url(#d1)"/>
<circle cx="82" cy="348" r="15" fill="#5c9c6b"/>
<text x="82" y="353" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text>
<text x="110" y="353" class="st" fill="#2f6b3e">需求分析 · 先确认理解，再谈方案</text>
<text x="110" y="375" class="cm">specs/&lt;feature&gt;/spec.md</text>

<rect x="110" y="388" width="1000" height="76" rx="8" fill="#f2f9f4" stroke="#c2dfcb" stroke-width="1.3"/>
<text x="126" y="408" font-size="11" font-weight="800" fill="#2f6b3e" letter-spacing="1.2">第一屏七件事；其中这五行是硬门（requires），缺任一行 runner 打 GATE</text>
<text x="126" y="431" class="it"><tspan font-weight="800" fill="#2f6b3e">① 原话（一字不改）　② 我理解你要的是　③ 可能理解错的地方　④ 本质　⑤ 怎样算满足</tspan></text>
<text x="126" y="451" class="gt">另两行「未知」「这次不做」模板要求写满，但不是机器门——机器只看上面五行的字面量</text>

<rect x="110" y="474" width="1000" height="26" rx="6" fill="#fff6e8" stroke="#e8cf9e" stroke-width="1.2"/>
<text x="126" y="492" class="gt" font-weight="700" fill="#8a6414">含糊时：把歧义写进「可能理解错的地方」，再 wait 停住。不要先猜一个看起来合理的含义。</text>

<path d="M590,514 L590,542" stroke="#8296aa" stroke-width="2.2" marker-end="url(#n)"/>
<text x="604" y="533" class="note" font-weight="700">内容门过了才往下；没过就停在这</text>

<!-- ===== STEP 3 ===== -->
<rect x="48" y="546" width="1084" height="118" rx="12" fill="#fff" stroke="#c9862f" stroke-width="2.2" filter="url(#d1)"/>
<circle cx="82" cy="572" r="15" fill="#c9862f"/>
<text x="82" y="577" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text>
<text x="110" y="577" class="st" fill="#96590f">影响面</text>
<text x="110" y="599" class="cm">specs/&lt;feature&gt;/impact.md</text>
<text x="110" y="624" class="it">四轴：调用方 · 状态机 · 权限 · 回滚　　维护性三查：新增枚举全库消费点 · 数据可逆性 · 契约破坏性</text>
<text x="110" y="646" class="it">每项要么带证据（文件:符号），要么显式写 UNVERIFIED。四轴整轴未验证就下结论 = 评估未做。</text>

<path d="M590,668 L590,696" stroke="#8296aa" stroke-width="2.2" marker-end="url(#n)"/>

<!-- ===== STEP 4 ===== -->
<rect x="48" y="700" width="1084" height="132" rx="12" fill="#fff" stroke="#4a62b8" stroke-width="2.2" filter="url(#d1)"/>
<circle cx="82" cy="726" r="15" fill="#4a62b8"/>
<text x="82" y="731" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text>
<text x="110" y="731" class="st" fill="#2f3f8a">技术方案 + 回滚预案</text>
<text x="110" y="753" class="cm">plan.md · rollback.md</text>
<text x="110" y="778" class="it">接口改什么 · 数据怎么变 · 状态怎么迁移 · 怎么验证　　DoD 每条都必须是可执行命令</text>
<text x="110" y="800" class="it">回滚必须是编号步骤，不是「视情况回滚」。空章节写「无」，不许删段落。</text>

<rect x="110" y="812" width="330" height="24" rx="5" fill="#eef1fb"/>
<text x="122" y="829" class="gt" font-weight="700" fill="#2f3f8a">方案门：gate 第一条非空行必须是 plan pass</text>

<!-- ===== STEP 5 ===== -->
<path d="M590,858 L590,886" stroke="#3f8f60" stroke-width="2.4" marker-end="url(#ng)"/>
<text x="604" y="877" class="note" font-weight="700" fill="#3f8f60">门过了，动手</text>

<rect x="48" y="890" width="1084" height="112" rx="12" fill="#fff" stroke="#7c4fb0" stroke-width="2.2" filter="url(#d1)"/>
<circle cx="82" cy="916" r="15" fill="#7c4fb0"/>
<text x="82" y="921" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text>
<text x="110" y="921" class="st" fill="#5a2d8a">编码</text>
<text x="110" y="943" class="cm">改文件 → 跑仓库自己的测试入口</text>
<text x="110" y="968" class="it">先搜再写：internal/pkg/helper、当前 Usecase/Repo、apply*Scope。第 2 次出现同语义逻辑必须复用已有实现。</text>
<text x="110" y="990" class="it">改完 done：先 gate_check 看工作树真动过，再跑 verify，然后往 evidence.log 追加一行（stage / 门 / 退出码 / head）</text>

<rect x="820" y="898" width="300" height="26" rx="6" fill="#fdeaea" stroke="#e0a5a1" stroke-width="1.2"/>
<text x="836" y="916" class="out" font-size="11">退出码非 0 → 停在 RED</text>

<!-- ===== STEP 6-7-8 ===== -->
<path d="M590,1002 L590,1030" stroke="#8296aa" stroke-width="2.2" marker-end="url(#n)"/>

<rect x="48" y="1034" width="352" height="130" rx="12" fill="#fff" stroke="#b54a4a" stroke-width="2.2" filter="url(#d1)"/>
<circle cx="80" cy="1060" r="14" fill="#b54a4a"/>
<text x="80" y="1065" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">6</text>
<text x="106" y="1065" class="st" fill="#8f2f2f">改动审核</text>
<text x="106" y="1085" class="cm">review/*.md</text>
<text x="106" y="1108" class="it">三轴并行读同一份 diff：</text>
<text x="106" y="1128" class="it">规范合规 · 代码质量 · 接口影响</text>
<text x="106" y="1150" class="it">主 agent 合并裁 risk 等级</text>

<rect x="414" y="1034" width="352" height="130" rx="12" fill="#fff" stroke="#3f8f83" stroke-width="2.2" filter="url(#d1)"/>
<circle cx="446" cy="1060" r="14" fill="#3f8f83"/>
<text x="446" y="1065" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">7</text>
<text x="472" y="1065" class="st" fill="#256b60">质量</text>
<text x="472" y="1085" class="cm">quality.md</text>
<text x="472" y="1108" class="it">构建 + 聚焦单测 + 覆盖率</text>
<text x="472" y="1128" class="it">只跑受影响的包，不顺手全量</text>
<text x="472" y="1150" class="it">没跑过的检查不许标 ✓</text>

<rect x="780" y="1034" width="352" height="130" rx="12" fill="#fff" stroke="#7c8a96" stroke-width="2.2" filter="url(#d1)"/>
<circle cx="812" cy="1060" r="14" fill="#7c8a96"/>
<text x="812" y="1065" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">8</text>
<text x="838" y="1065" class="st" fill="#4a5866">接口</text>
<text x="838" y="1085" class="cm">interface-test.md</text>
<text x="838" y="1108" class="it">三级门（Go 栈）：go test ./api/…</text>
<text x="838" y="1128" class="it">→ contract_diff.sh 判 breaking</text>
<text x="838" y="1150" class="it">→ 场景回放，跑不了如实 WAIVED</text>

<!-- ===== STEP 9 ===== -->
<path d="M590,1164 L590,1192" stroke="#8296aa" stroke-width="2.2" marker-end="url(#n)"/>

<rect x="48" y="1196" width="1084" height="96" rx="12" fill="#fff" stroke="#3d4d5c" stroke-width="2.2" filter="url(#d1)"/>
<circle cx="82" cy="1222" r="15" fill="#3d4d5c"/>
<text x="82" y="1227" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">9</text>
<text x="110" y="1227" class="st" fill="#22303c">提交</text>
<text x="110" y="1249" class="cm">change-note.md → commit / MR</text>
<text x="110" y="1272" class="it">文档审计门：需要同步的文档已同步，或显式记账「接受的文档风险」。不同步又不记账 = 不许沉默提交。</text>

<!-- ===== side: change 三步 ===== -->
<rect x="48" y="1314" width="1084" height="86" rx="12" fill="#fffaef" stroke="#c9a44e" stroke-width="2" filter="url(#d1)"/>
<text x="72" y="1340" font-size="13" font-weight="800" fill="#8a6414">旁路：任意仓库的一次改动 → change 三步</text>
<text x="72" y="1363" class="it">① decision.md（同样七行第一屏，硬门是前五行字面量）　② 只改决定里写了的范围（gate_check 查工作树真动过）　③ check.md 首行是 verify.log 的 exit 那一行</text>
<text x="72" y="1384" class="gt">碰到契约、持久化、权限、状态或回滚 → 改走 feature 或 hotfix。纯 .gitignore 改动是 gate_check 的已知盲区。</text>

<text x="48" y="1414" class="note" font-size="10.5">v0.3 · 阶段与门以 workflows/*.json 和 workflow_next.py 为准；本图只画顺序，不重复判据细节</text>
</svg>
